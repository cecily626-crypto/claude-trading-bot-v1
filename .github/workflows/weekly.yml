name: weekly-review
on:
  # 每周《做多1.0策略》+【2.0空】复盘推送已停用 (2026-08-26): 两个策略都在暂停/影子模式中,
  # 常规复盘推送对已暂停策略没有意义。恢复条件告警(resume_watch.py)不受影响,仍在跑。
  # 如需恢复, 取消下面 schedule 两行注释即可。
  # schedule:
  #   - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - name: weekly review (v1 long/short + v2.0-short)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python weekly_review.py
          python weekly_review_short.py
      - name: save history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add review_history.json review_history_short.json || true
          git commit -m "weekly review history" || true
          git push || true
